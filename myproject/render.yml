services:
  - type: web
    name: roadwatch
    env: docker
    dockerCommand: ./entrypoint.sh
    envVars:
      - key: PORT
        value: 8000
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DEBUG
        value: "0"
      - key: DB_HOST
        fromDatabase:
          name: roadwatch-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: roadwatch-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: roadwatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: roadwatch-db
          property: password

  - type: database
    name: roadwatch-db
    plan: free
    databaseName: roadwatch
    ipAllowList: []
